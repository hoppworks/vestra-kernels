name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show pinned toolchain
        run: rustc --version --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint default targets
        run: cargo clippy --all-targets -- -D warnings

      - name: Lint optional CUDA module
        run: cargo clippy --lib --tests --features cuda -- -D warnings

      - name: Test default targets
        run: cargo test --all-targets

      - name: Test optional CUDA module
        run: cargo test --lib --tests --features cuda
