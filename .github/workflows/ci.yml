name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: rustc --version --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint default targets
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Lint optional CUDA module
        run: cargo clippy --locked --lib --tests --features cuda -- -D warnings

      - name: Test default targets
        run: cargo test --locked --all-targets

      - name: Test optional CUDA module
        run: cargo test --locked --lib --tests --features cuda
