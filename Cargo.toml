[package]
name = "vestra-kernels"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Specialized CPU and CUDA kernels for Vestra Engine"
repository = "https://github.com/hoppworks/vestra-kernels"

[dependencies]
cudarc = { version = "0.19.9", default-features = false, features = ["driver", "dynamic-loading", "cuda-12000", "nvrtc", "cublas"], optional = true }
faer = "0.19"
half = "2"
rayon = "1.10"
thiserror = "2"

[features]
default = []
cuda = ["dep:cudarc"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "gemm_bench"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(da3_blis)'] }
