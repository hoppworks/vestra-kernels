[package]
name = "vestra-kernels"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Specialized CPU and CUDA kernels for Vestra Engine"
repository = "https://github.com/hoppworks/vestra-kernels"

[dependencies]
faer = "0.19"
half = "2"
rayon = "1.10"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "gemm_bench"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(da3_blis)'] }
